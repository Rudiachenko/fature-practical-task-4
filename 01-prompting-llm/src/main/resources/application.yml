spring:
  application:
    name: prompting-llm
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPEN_AI_KEY}
        endpoint: ${AZURE_OPEN_AI_ENDPOINT}
        chat:
          options:
            deployment-name: ${AZURE_OPEN_AI_DEPLOYMENT_NAME:gpt-4o}

app:
  chat:
    model-name: ${AZURE_OPEN_AI_DEPLOYMENT_NAME:gpt-4o}
    system-prompt: classpath:/prompts/system_prompt.st
    max-memory-messages: 20
    default-temperature: 0.7
    top-p-supported: ${DIAL_TOP_P_SUPPORTED:true}
    top-p-fallback-temperature: 0.7
    raw-response-capture-path: ${RAW_MODEL_RESPONSE_CAPTURE_PATH:}
