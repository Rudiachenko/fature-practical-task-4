spring:
  application:
    name: doc-qa-chatbot
  jmx:
    enabled: false
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPEN_AI_KEY}
        endpoint: ${AZURE_OPEN_AI_ENDPOINT}
        chat:
          options:
            deployment-name: ${AZURE_OPEN_AI_DEPLOYMENT_NAME:gpt-4o}
        embedding:
          options:
            deployment-name: ${AZURE_OPEN_AI_EMBEDDING_DEPLOYMENT_NAME:text-embedding-3-small-1}

app:
  rag:
    system-prompt: classpath:prompts/rag_system_prompt.st
    max-memory-messages: 20
    # QuestionAnswerAdvisor configuration
    question-answer:
      enabled: true
      similarity-threshold: 0.3
      top-k: 5
      allow-empty-context: false
    # Query transformation configuration
    query-transformation:
      compression-enabled: true    # Enable to use conversation history in retrieval
      rewrite-enabled: true        # Enable to rewrite queries for better results
    # Query expansion configuration
    query-expansion:
      enabled: true                 # Enable to generate multiple query variations
      number-of-queries: 3
      include-original: true
    # Document retrieval configuration
    retrieval:
      similarity-threshold: 0.3
      top-k: 5
  vectorstore:
    chroma:
      base-url: ${CHROMA_BASE_URL:http://localhost:8000}
      tenant-name: ${CHROMA_TENANT:default_tenant}
      database-name: ${CHROMA_DATABASE:default_database}
      collection-name: ${CHROMA_COLLECTION:doc-qa-collection}
  documents:
    default:
      resources:
        - classpath:documents/llm_context_document.pdf
    processing:
      chunking:
        enabled: true
        tokens-per-chunk: 800
        min-chunk-size-chars: 100
        min-chunk-length-to-embed: 50
        max-num-chunks: 10000
        keep-separator: true

logging:
  level:
    sun.rmi.transport.tcp: ERROR
