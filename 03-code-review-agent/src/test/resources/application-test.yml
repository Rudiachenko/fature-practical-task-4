spring:
  ai:
    azure:
      openai:
        api-key: hermetic-test-key
        endpoint: http://127.0.0.1:1
        chat:
          options:
            deployment-name: hermetic-test-deployment
app:
  code-review:
    system-prompt: classpath:prompts/code-review-system-prompt.md
    repository-root: src/test/resources/fixtures/repo-root
    max-iterations: 8
    max-file-chars: 20000
  conventions:
    resources:
      - classpath:documents/java-convention.md
      - classpath:documents/python-convention.md
